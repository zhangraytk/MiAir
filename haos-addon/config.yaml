name: "MiAir"
description: "让小米小爱音箱支持 DLNA 与 AirPlay (含实验性 AirPlay 2) 网络流媒体播放"
version: "1.1.5"
slug: "miair"
url: "https://github.com/zhangraytk/MiAir"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
privileged:
  - SYS_NICE
  - NET_ADMIN
ports:
  8300/tcp: 8300
  8200/tcp: 8200
  7000/tcp: 7000
  7001/tcp: 7001
  7002/tcp: 7002
  7003/tcp: 7003
  7004/tcp: 7004
  7005/tcp: 7005
  319/udp: 319
  320/udp: 320
ports_description:
  8300/tcp: "MiAir Web 管理界面"
  8200/tcp: "DLNA 服务端口"
  7000/tcp: "AirPlay 2 RTSP 基础端口 (音箱 1)"
  7001/tcp: "AirPlay 2 RTSP 端口 (音箱 2)"
  7002/tcp: "AirPlay 2 RTSP 端口 (音箱 3)"
  7003/tcp: "AirPlay 2 RTSP 端口 (音箱 4)"
  7004/tcp: "AirPlay 2 RTSP 端口 (音箱 5)"
  7005/tcp: "AirPlay 2 RTSP 端口 (音箱 6)"
  319/udp: "PTP 高精度时钟同步事件端口"
  320/udp: "PTP 高精度时钟常规报文端口"
webui: "http://[HOST]:[PORT:8300]"
map:
  - config:rw
  - share:rw
schema:
  airplay_mode: "list(legacy|experimental)?"
  verbose: "bool?"
  dlna_port: "int?"
  web_port: "int?"
  airplay2_port: "int?"
  airplay2_latency_offset_ms: "int?"
  airplay2_prebuffer_ms: "int?"
  airplay2_sync_debug: "bool?"
options:
  airplay_mode: "legacy"
  verbose: true
  dlna_port: 8200
  web_port: 8300
  airplay2_port: 7000
  airplay2_latency_offset_ms: 0
  airplay2_prebuffer_ms: 0
  airplay2_sync_debug: false
